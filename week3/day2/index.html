<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristian Muñoz - Product Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                    },
                    container: {
                        center: true,
                        padding: {
                            DEFAULT: '1.5rem',
                            md: '2rem',
                            lg: '4rem'
                        },
                    }
                }
            }
        }
    </script>
    <style>
        body { opacity: 0; transition: opacity 0.3s ease-in-out; }
        
        .toggle-switch {
            position: relative;
            width: 60px;
            height: 30px;
            background: #374151;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .toggle-switch.active {
            background: #8b5cf6;
        }
        
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .toggle-switch.active::after {
            transform: translateX(30px);
        }
        
        .mobile-menu {
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }
        
        .mobile-menu.active {
            transform: translateX(0);
        }
        
        .social-icon {
            transition: all 0.3s ease;
        }
        
        .gradient-text {
            background: linear-gradient(45deg, #ec4899, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .diamond {
            width: 40px;
            height: 40px;
            background: white;
            transform: rotate(45deg);
            border-radius: 0px;
        }
        
        .dark .diamond {
            background: #374151;
        }
    </style>
</head>
<body class="bg-white dark:bg-black text-black dark:text-white transition-colors duration-300">
    <!-- Navigation -->
    <nav class="container mx-auto px-6 py-8 flex justify-between items-center">
        <!-- Logo -->
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-white dark:bg-black rounded-full flex items-center justify-center">
                <img src="./image/p2.png" alt="Logo" class="h-5 w-5 invert dark:invert-0">
            </div>
            <span class="font-bold text-xl">tian</span>
        </div>
        
        <!-- Desktop Navigation -->
        <div class="hidden md:flex items-center space-x-8">
            <a href="#home" class="hover:text-purple-500 transition-colors">Home</a>
            <a href="#portfolio" class="hover:text-purple-500 transition-colors">Portfolio</a>
            <a href="#skills" class="hover:text-purple-500 transition-colors">Skills</a>
            <a href="#about" class="hover:text-purple-500 transition-colors">About Me</a>
        </div>
        
        <!-- Desktop Controls -->
        <div class="hidden md:flex items-center space-x-4">
            <div id="darkModeToggle" class="toggle-switch"></div>
            <button class="bg-black dark:bg-[#925FF0] hover:bg-purple-700 text-white px-4 py-2 rounded-md transition-colors">
                Contact Us
            </button>
        </div>
        
        <!-- Mobile Menu Button -->
        <div class="md:hidden flex items-center space-x-4">
            <div id="mobileDarkModeToggle" class="toggle-switch"></div>
            <button id="mobileMenuBtn" class="text-2xl">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>
    
    <!-- Mobile Menu -->
    <div class="mobile-menu fixed inset-0 bg-black bg-opacity-50 z-50 md:hidden">
        <div class="absolute right-0 top-0 h-full w-80 bg-white dark:bg-black shadow-xl p-6">
            <div class="flex justify-between items-center mb-8">
                <span class="text-xl font-bold">Menu</span>
                <button id="closeMobileMenu" class="text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <nav class="space-y-6">
                <a href="#home" class="block text-lg hover:text-purple-500 transition-colors">Home</a>
                <a href="#portfolio" class="block text-lg hover:text-purple-500 transition-colors">Portfolio</a>
                <a href="#skills" class="block text-lg hover:text-purple-500 transition-colors">Skills</a>
                <a href="#about" class="block text-lg hover:text-purple-500 transition-colors">About Me</a>
                <button class="w-full bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-full transition-colors mt-8">
                    Contact Us
                </button>
            </nav>
        </div>
    </div>
    
    <!-- Main Content -->
    <main class="container mx-auto px-6 py-16 lg:py-20">
        <div class="grid lg:grid-cols-2 gap-16 items-center min-h-[80vh] md:justify-center">
            <!-- Left Content -->
            <div class="space-y-8 flex flex-col justify-center min-h-[80vh] lg:min-h-0">
                <!-- Main Title -->
                <div class="space-y-4 text-center md:text-left">
                    <div class="flex items-start lg:items-center justify-center md:justify-start space-x-6 lg:space-x-8">
                        <h1 class="text-[3.8rem] lg:text-[6.2rem] font-black leading-[1]">
                            PRODUCT<br>
                            DESIGNER
                        </h1>
                        <div class="hidden lg:block mt-2">
                            <img src="./image/p3.png" alt="Logo" class="h-24 w-24 invert dark:invert-0">
                        </div>
                    </div>
                    <h2 class="text-[2.4rem] lg:text-[3.5rem] font-bold gradient-text tracking-wide">
                        CRISTIAN MUÑOZ
                    </h2>
                </div>

                <!-- Social Media Icons -->
                <div class="flex flex-wrap justify-center md:justify-start gap-6 lg:gap-8 mt-4 md:gap-4 sm:gap-2">
                    <a href="#" class="social-icon w-12 h-12 bg-gray-100 dark:bg-gray-800 rounded-lg flex items-center justify-center hover:bg-purple-100 dark:hover:bg-purple-900">
                        <i class="fab fa-instagram text-xl"></i>
                    </a>
                    <a href="#" class="social-icon w-12 h-12 bg-gray-100 dark:bg-gray-800 rounded-lg flex items-center justify-center hover:bg-purple-100 dark:hover:bg-purple-900">
                        <i class="fab fa-figma text-xl"></i>
                    </a>
                    <a href="#" class="social-icon w-12 h-12 bg-gray-100 dark:bg-gray-800 rounded-lg flex items-center justify-center hover:bg-purple-100 dark:hover:bg-purple-900">
                        <i class="fab fa-linkedin text-xl"></i>
                    </a>
                    <a href="#" class="social-icon w-12 h-12 bg-gray-100 dark:bg-gray-800 rounded-lg flex items-center justify-center hover:bg-purple-100 dark:hover:bg-purple-900">
                        <i class="fab fa-twitter text-xl"></i>
                    </a>
                    <a href="#" class="social-icon w-12 h-12 bg-gray-100 dark:bg-gray-800 rounded-lg flex items-center justify-center hover:bg-purple-100 dark:hover:bg-purple-900">
                        <i class="fab fa-dribbble text-xl"></i>
                    </a>
                    <a href="#" class="social-icon w-12 h-12 bg-gray-100 dark:bg-gray-800 rounded-lg flex items-center justify-center hover:bg-purple-100 dark:hover:bg-purple-900">
                        <i class="fab fa-medium text-xl"></i>
                    </a>
                </div>

                <!-- Download CV Button -->
                <button class="w-[85%] lg:w-[78%] bg-black dark:bg-white text-white dark:text-black px-8 py-4 rounded-lg font-semibold hover:bg-gray-800 dark:hover:bg-gray-200 transition-colors flex items-center justify-center space-x-2 mx-auto md:mx-0 mt-2">
                    <span>Download Curriculum Vitae</span>
                    <i class="fas fa-download"></i>
                </button>
            </div>

            <!-- Right Content - Hero Image -->
            <div class="relative hidden lg:flex justify-end pr-4">
                <div class="w-[95%] aspect-square rounded-sm overflow-hidden">
                    <img src="./image/p1.jpg" 
                         alt="Creative Design Collage" 
                         class="w-full h-full object-cover rounded-sm">
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
